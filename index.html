<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Time Performance Overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    /* =========================================
       MATERIAL DESIGN 3 - DARK THEME
       ========================================= */
    :root {
      --md-sys-color-primary: #D0BCFF;
      --md-sys-color-on-primary: #381E72;
      --md-sys-color-primary-container: #4F378B;
      --md-sys-color-on-primary-container: #EADDFF;
      --md-sys-color-secondary: #CCC2DC;
      --md-sys-color-on-secondary: #332D41;
      --md-sys-color-secondary-container: #4A4458;
      --md-sys-color-on-secondary-container: #E8DEF8;
      --md-sys-color-tertiary: #EFB8C8;
      --md-sys-color-on-tertiary: #492532;
      --md-sys-color-tertiary-container: #633B48;
      --md-sys-color-on-tertiary-container: #FFD8E4;
      --md-sys-color-error: #F2B8B5;
      --md-sys-color-on-error: #601410;
      --md-sys-color-error-container: #8C1D18;
      --md-sys-color-on-error-container: #F9DEDC;
      --md-sys-color-surface: #1C1B1F;
      --md-sys-color-on-surface: #E6E1E5;
      --md-sys-color-surface-variant: #49454F;
      --md-sys-color-on-surface-variant: #CAC4D0;
      --md-sys-color-outline: #938F99;
      --md-sys-color-outline-variant: #49454F;
      --md-sys-color-shadow: #000000;
      --md-sys-color-scrim: #000000;
      --md-sys-color-inverse-surface: #E6E1E5;
      --md-sys-color-inverse-on-surface: #322F35;
      --md-sys-color-inverse-primary: #6750A4;
      --md-sys-color-surface-tint: #D0BCFF;
      --md-sys-color-background: #121212;
      --md-sys-color-on-background: #E6E1E5;
      
      --md-sys-elevation-1: 0px 1px 3px 1px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.3);
      --md-sys-elevation-2: 0px 2px 6px 2px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.3);
      --md-sys-elevation-3: 0px 4px 8px 3px rgba(0,0,0,0.15), 0px 1px 3px 0px rgba(0,0,0,0.3);
      
      --radius-small: 8px;
      --radius-medium: 12px;
      --radius-large: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Typography */
    .headline-large { font-size: 32px; font-weight: 400; line-height: 40px; letter-spacing: 0; }
    .headline-medium { font-size: 28px; font-weight: 400; line-height: 36px; letter-spacing: 0; }
    .headline-small { font-size: 24px; font-weight: 400; line-height: 32px; letter-spacing: 0; }
    .title-large { font-size: 22px; font-weight: 500; line-height: 28px; letter-spacing: 0; }
    .title-medium { font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: 0.15px; }
    .title-small { font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.1px; }
    .body-large { font-size: 16px; font-weight: 400; line-height: 24px; letter-spacing: 0.5px; }
    .body-medium { font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: 0.25px; }
    .body-small { font-size: 12px; font-weight: 400; line-height: 16px; letter-spacing: 0.4px; }
    .label-large { font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.1px; }
    .label-medium { font-size: 12px; font-weight: 500; line-height: 16px; letter-spacing: 0.5px; }
    .label-small { font-size: 11px; font-weight: 500; line-height: 16px; letter-spacing: 0.5px; }

    /* Loading */
    .loading-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; backdrop-filter: blur(4px);
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid var(--md-sys-color-outline-variant);
      border-top-color: var(--md-sys-color-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Buttons */
    .button {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; padding: 10px 24px; border: none; border-radius: 20px;
      font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 500;
      letter-spacing: 0.1px; cursor: pointer; transition: all 0.2s;
      text-decoration: none; height: 40px;
    }
    .button.filled {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      box-shadow: var(--md-sys-elevation-1);
    }
    .button.filled:hover { box-shadow: var(--md-sys-elevation-2); filter: brightness(1.1); }
    .button.tonal {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .button.tonal:hover { filter: brightness(1.15); }
    .button.text {
      background: transparent; color: var(--md-sys-color-primary);
      padding: 10px 12px;
    }
    .button.text:hover { background: rgba(208, 188, 255, 0.08); }

    /* Text Field */
    .text-field {
      position: relative; margin-bottom: 16px;
    }
    .text-field input {
      width: 100%; height: 56px; padding: 12px 16px 8px;
      background: var(--md-sys-color-surface-variant);
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--radius-small);
      color: var(--md-sys-color-on-surface);
      font-size: 16px; outline: none; transition: 0.2s;
    }
    .text-field input:focus {
      border-color: var(--md-sys-color-primary);
      border-width: 2px; padding: 11px 15px 7px;
    }
    .text-field label {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 16px; transition: 0.2s; pointer-events: none;
      background: transparent; padding: 0 4px;
    }
    .text-field input:focus + label,
    .text-field input:not(:placeholder-shown) + label {
      top: 0; transform: translateY(-50%) scale(0.85);
      color: var(--md-sys-color-primary);
      background: var(--md-sys-color-surface-variant);
    }

    /* Cards */
    .card {
      background: var(--md-sys-color-surface);
      border-radius: var(--radius-medium);
      box-shadow: var(--md-sys-elevation-1);
      border: 1px solid var(--md-sys-color-outline-variant);
      overflow: hidden;
    }

    /* Login View */
    .login-view {
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #1C1B1F 0%, #2D2D35 100%);
    }
    .login-card {
      width: 100%; max-width: 420px; padding: 32px;
      display: flex; flex-direction: column; gap: 24px;
    }
    .login-card .headline-large {
      color: var(--md-sys-color-on-surface);
      text-align: center;
    }
    .login-card .body-medium {
      color: var(--md-sys-color-on-surface-variant);
      text-align: center; margin-top: -16px;
    }

    /* Dashboard Layout */
    .dashboard-view {
      display: flex; min-height: 100vh;
    }
    .nav-drawer {
      width: 280px; min-width: 280px;
      background: var(--md-sys-color-surface);
      border-right: 1px solid var(--md-sys-color-outline-variant);
      padding: 24px 16px;
      display: flex; flex-direction: column; gap: 16px;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .nav-header {
      padding: 8px 16px 16px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: var(--radius-large);
      color: var(--md-sys-color-on-surface-variant);
      text-decoration: none; font-size: 14px; font-weight: 500;
      transition: 0.2s; cursor: pointer; border: none; background: none; width: 100%;
    }
    .nav-item:hover {
      background: rgba(208, 188, 255, 0.08);
      color: var(--md-sys-color-on-surface);
    }
    .nav-item.active {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .nav-item .material-icons { font-size: 20px; }
    .divider {
      height: 1px; background: var(--md-sys-color-outline-variant);
      margin: 8px 0;
    }

    .main-content {
      flex: 1; padding: 24px 32px;
      overflow-y: auto; max-height: 100vh;
    }
    .top-app-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Stats */
    .stats-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--radius-medium);
      padding: 20px; display: flex; flex-direction: column; gap: 8px;
      transition: 0.2s;
    }
    .stat-card:hover { box-shadow: var(--md-sys-elevation-2); }
    .stat-card .label {
      font-size: 12px; font-weight: 500; letter-spacing: 0.5px;
      text-transform: uppercase; color: var(--md-sys-color-on-surface-variant);
    }
    .stat-card .value {
      font-size: 32px; font-weight: 400; color: var(--md-sys-color-on-surface);
    }
    .stat-card[data-cat="under-6.5"] { border-left: 4px solid var(--md-sys-color-error); }
    .stat-card[data-cat="base-6.5-8"] { border-left: 4px solid var(--md-sys-color-primary); }
    .stat-card[data-cat="ot-2hr"] { border-left: 4px solid var(--md-sys-color-secondary); }
    .stat-card[data-cat="ot-4hr"] { border-left: 4px solid var(--md-sys-color-tertiary); }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }
    .user-card {
      display: flex; flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .user-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--md-sys-elevation-3);
    }
    .card-header {
      display: flex; gap: 16px; padding: 20px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      align-items: center;
    }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 500; flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-info .title-medium {
      color: var(--md-sys-color-on-surface);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .user-info .body-small {
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 2px;
    }
    .card-body {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 16px; padding: 20px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .metric { display: flex; flex-direction: column; gap: 4px; }
    .metric .label {
      font-size: 11px; font-weight: 500; letter-spacing: 0.5px;
      color: var(--md-sys-color-on-surface-variant); text-transform: uppercase;
    }
    .metric .value {
      font-size: 18px; font-weight: 500; color: var(--md-sys-color-on-surface);
    }
    .card-footer {
      padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 8px;
      background: rgba(255,255,255,0.02);
    }
    .day-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 8px;
      font-size: 12px; font-weight: 500;
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .day-chip.under-6\.5 {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      border-color: var(--md-sys-color-error);
    }
    .day-chip.base-6\.5-8 {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    .day-chip.ot-2hr {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .day-chip.ot-4hr {
      background: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
    }

    /* Data Table */
    .data-table {
      width: 100%; border-collapse: collapse;
      background: var(--md-sys-color-surface);
      border-radius: var(--radius-medium);
      overflow: hidden; box-shadow: var(--md-sys-elevation-1);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .data-table th {
      background: var(--md-sys-color-surface-variant);
      color: var(--md-sys-color-on-surface-variant);
      text-align: left; padding: 16px;
      font-size: 12px; font-weight: 500; letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .data-table td {
      padding: 16px; border-top: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-surface); font-size: 14px;
    }
    .data-table tr:hover td {
      background: rgba(208, 188, 255, 0.04);
    }

    /* Repeated View */
    #repeated-view {
      background: var(--md-sys-color-surface);
      border-radius: var(--radius-medium);
      padding: 24px; border: 1px solid var(--md-sys-color-outline-variant);
    }
    #repeated-view h3 {
      margin-bottom: 20px; color: var(--md-sys-color-on-surface);
    }

    /* Responsive */
    @media (max-width: 960px) {
      .nav-drawer { width: 72px; min-width: 72px; padding: 16px 8px; }
      .nav-drawer .nav-header span { display: none; }
      .nav-item { justify-content: center; padding: 12px; }
      .nav-item span:last-child { display: none; }
      .main-content { padding: 16px; }
      .cards-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .top-app-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading" class="loading-overlay" style="display:none">
    <div class="spinner"></div>
  </div>

  <!-- Login View -->
  <div id="login-view" class="login-view">
    <div class="card login-card">
      <div class="headline-large">Active Time Performance</div>
      <div class="body-medium">Overview – Under 6.5 Hours</div>
      <form id="login-form" style="display:flex;flex-direction:column;gap:8px;">
        <div class="text-field">
          <input type="text" id="username" placeholder=" " required autocomplete="off">
          <label>Username</label>
        </div>
        <div class="text-field">
          <input type="password" id="password" placeholder=" " required>
          <label>Password</label>
        </div>
        <button type="submit" class="button filled" style="margin-top:8px;">
          <span class="material-icons">login</span> Sign In
        </button>
      </form>
      <div id="login-error" class="body-small" style="color:var(--md-sys-color-error);text-align:center;display:none;">
        Invalid username or password
      </div>
    </div>
  </div>

  <!-- Dashboard View -->
  <div id="dashboard-view" class="dashboard-view" style="display:none;">
    <aside class="nav-drawer">
      <div class="nav-header">
        <span class="title-medium">Workforce</span>
      </div>
      <nav>
        <button class="nav-item active" data-shift="all">
          <span class="material-icons">groups</span>
          <span>All Shifts</span>
        </button>
        <button class="nav-item" data-shift="morning">
          <span class="material-icons">wb_sunny</span>
          <span>Morning</span>
        </button>
        <button class="nav-item" data-shift="night">
          <span class="material-icons">nights_stay</span>
          <span>Night</span>
        </button>
        <button class="nav-item" data-shift="overnight">
          <span class="material-icons">bedtime</span>
          <span>Overnight</span>
        </button>
        <div class="divider"></div>
        <button class="nav-item" data-shift="repeated">
          <span class="material-icons">warning</span>
          <span>Repeated Under 6.5</span>
        </button>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-app-bar">
        <div>
          <h2 class="title-large">Active Time Performance Overview</h2>
          <div class="body-small" style="color:var(--md-sys-color-on-surface-variant);margin-top:4px;">
            Under 6.5 Hours Analysis
          </div>
        </div>
        <div class="actions">
          <button class="button tonal" onclick="app.exportToExcel()">
            <span class="material-icons">download</span> Excel
          </button>
          <button class="button tonal" onclick="app.exportToSheets()">
            <span class="material-icons">open_in_new</span> Google Sheet
          </button>
          <button class="button filled" onclick="app.loadDashboardData()">
            <span class="material-icons">refresh</span> Refresh
          </button>
          <button class="button text" onclick="app.logout()">
            <span class="material-icons">logout</span> Logout
          </button>
        </div>
      </header>

      <div class="stats-row">
        <div class="stat-card" data-cat="under-6.5">
          <span class="label">Under 6.5h</span>
          <span class="value" id="stat-under">0</span>
        </div>
        <div class="stat-card" data-cat="base-6.5-8">
          <span class="label">Base Shift 6.5-8h</span>
          <span class="value" id="stat-base">0</span>
        </div>
        <div class="stat-card" data-cat="ot-2hr">
          <span class="label">OT 8-10h</span>
          <span class="value" id="stat-ot2">0</span>
        </div>
        <div class="stat-card" data-cat="ot-4hr">
          <span class="label">OT 10-12h</span>
          <span class="value" id="stat-ot4">0</span>
        </div>
      </div>

      <div id="cards-view">
        <div class="cards-grid" id="cards-container"></div>
      </div>

      <div id="repeated-view" style="display:none;">
        <h3 class="headline-small">Repeated Under 6.5 Users</h3>
        <div style="overflow-x:auto;margin-top:16px;">
          <table class="data-table">
            <thead>
              <tr>
                <th>User</th>
                <th>Email</th>
                <th>Shift</th>
                <th>Repeated Days</th>
                <th>Dates</th>
                <th>Total Hours</th>
              </tr>
            </thead>
            <tbody id="repeated-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    /* =========================================
       CONFIGURATION
       ========================================= */
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx5sUvifNlxDduQCtcNek-UY3RlhhcQUhkfDKDwRxub_BgbriFIVSpiNgknLsgKVn9T7A/exec';

    /* =========================================
       APP STATE & CLASSES
       ========================================= */
    class App {
      constructor() {
        this.state = {
          raw: { users: [], activeTime: [], teams: [], attendance: {} },
          processed: [],
          filtered: [],
          repeated: [],
          currentShift: 'all',
          isLoading: false
        };
        this.init();
      }

      init() {
        this.checkAuth();
        this.bindEvents();
      }

      checkAuth() {
        const session = localStorage.getItem('atp_session');
        if (session) {
          this.showDashboard();
        } else {
          this.showLogin();
        }
      }

      bindEvents() {
        document.getElementById('login-form').addEventListener('submit', (e) => {
          e.preventDefault();
          this.login();
        });

        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const shift = btn.dataset.shift;
            this.setActiveNav(btn);
            this.filterByShift(shift);
          });
        });
      }

      setActiveNav(activeBtn) {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        activeBtn.classList.add('active');
      }

      setLoading(v) {
        this.state.isLoading = v;
        document.getElementById('loading').style.display = v ? 'flex' : 'none';
      }

      async fetchAPI(action, params = {}) {
        const url = new URL(GAS_URL);
        url.searchParams.set('action', action);
        Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
        const res = await fetch(url.toString());
        if (!res.ok) throw new Error('Network error');
        return res.json();
      }

      async login() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const errorEl = document.getElementById('login-error');
        errorEl.style.display = 'none';

        this.setLoading(true);
        try {
          const users = await this.fetchAPI('users');
          const found = users.find(u => u[0] && u[0].toString().trim() === user && u[1] && u[1].toString().trim() === pass);
          if (found) {
            localStorage.setItem('atp_session', JSON.stringify({ user, time: Date.now() }));
            this.showDashboard();
          } else {
            errorEl.style.display = 'block';
          }
        } catch (e) {
          alert('Connection error: ' + e.message);
        }
        this.setLoading(false);
      }

      logout() {
        localStorage.removeItem('atp_session');
        location.reload();
      }

      showLogin() {
        document.getElementById('login-view').style.display = 'flex';
        document.getElementById('dashboard-view').style.display = 'none';
      }

      showDashboard() {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'flex';
        this.loadDashboardData();
      }

      async loadDashboardData() {
        this.setLoading(true);
        try {
          const [activeTime, teams] = await Promise.all([
            this.fetchAPI('activeTime'),
            this.fetchAPI('teams')
          ]);

          const [morning, night, overnight] = await Promise.all([
            this.fetchAPI('attendance', { tab: 'Morning' }),
            this.fetchAPI('attendance', { tab: 'Night' }),
            this.fetchAPI('attendance', { tab: 'Overnight' })
          ]);

          this.state.raw = {
            users: this.state.raw.users,
            activeTime,
            teams,
            attendance: { Morning: morning, Night: night, Overnight: overnight }
          };

          this.processData();
          this.filterByShift('all');
        } catch (e) {
          console.error(e);
          alert('Failed to load data: ' + e.message);
        }
        this.setLoading(false);
      }

      /* =========================================
         DATA PROCESSING ENGINE
         ========================================= */
      processData() {
        const { activeTime, teams, attendance } = this.state.raw;

        // 1. Teams Map (case-insensitive) + Order
        const teamsMap = new Map();
        const teamsOrder = [];
        teams.forEach(row => {
          const user = row[0].toString().toLowerCase().trim();
          teamsOrder.push(user);
          teamsMap.set(user, {
            email: row[1] || '',
            shift: row[2] || '',
            extra1: row[3] || '',
            extra2: row[4] || ''
          });
        });

        // 2. Sum C+D per user per date from Active Time
        const userDayMap = new Map();
        const datesSet = new Set();

        activeTime.forEach(row => {
          const date = row[0] ? row[0].toString().trim() : '';
          const user = row[1] ? row[1].toString().toLowerCase().trim() : '';
          const interact = parseFloat(row[2]) || 0;
          const overhead = parseFloat(row[3]) || 0;
          const total = interact + overhead;

          if (!date || !user) return;
          datesSet.add(date);

          const key = user + '|' + date;
          if (!userDayMap.has(key)) {
            userDayMap.set(key, { user, date, hours: 0, attendance: '', attendanceTab: '' });
          }
          userDayMap.get(key).hours += total;
        });

        // 3. Format date: "2026-06-07" or "2026, 06-07" -> "7-Jun"
        const fmtDate = (dStr) => {
          const m = dStr.match(/(\d{4})[,\s-]+(\d{2})[,\s-]+(\d{2})/);
          if (m) {
            const d = new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
            return d.getDate() + '-' + d.toLocaleString('en', { month: 'short' });
          }
          return dStr;
        };

        // 4. Match Attendance (Morning/Night/Overnight)
        userDayMap.forEach((val) => {
          const target = fmtDate(val.date);
          for (const [tabName, tabData] of Object.entries(attendance)) {
            if (!tabData || !tabData.headers) continue;
            const headers = tabData.headers;
            const rows = tabData.rows;
            const colIdx = headers.findIndex(h => h === target);
            if (colIdx === -1) continue;

            // D is column 4 -> index 3 in full row
            const actualIdx = 3 + colIdx;
            const userRow = rows.find(r => r[0] && r[0].toString().toLowerCase().trim() === val.user);
            if (userRow && actualIdx < userRow.length) {
              const cell = userRow[actualIdx] ? userRow[actualIdx].toString().trim() : '';
              if (['P', 'PT', 'TP'].includes(cell)) {
                val.attendance = cell;
                val.attendanceTab = tabName;
                break;
              }
            }
          }
        });

        // 5. Sort users by Teams order (Active Time users only)
        const activeUsers = [...new Set([...userDayMap.values()].map(v => v.user))];
        activeUsers.sort((a, b) => {
          const ia = teamsOrder.indexOf(a);
          const ib = teamsOrder.indexOf(b);
          if (ia === -1 && ib === -1) return 0;
          if (ia === -1) return 1;
          if (ib === -1) return -1;
          return ia - ib;
        });

        // 6. Build processed array
        const processed = [];
        const dates = [...datesSet].sort();

        activeUsers.forEach(user => {
          const tInfo = teamsMap.get(user) || {};
          dates.forEach(date => {
            const key = user + '|' + date;
            const data = userDayMap.get(key);
            if (!data) return;

            const hrs = data.hours;
            let cat = '';
            if (hrs < 6.5) cat = 'under-6.5';
            else if (hrs < 8) cat = 'base-6.5-8';
            else if (hrs < 10) cat = 'ot-2hr';
            else if (hrs < 12) cat = 'ot-4hr';
            else cat = 'ot-4hr-plus';

            processed.push({
              date,
              user,
              userOriginal: data.user,
              email: tInfo.email,
              shift: tInfo.shift,
              hours: parseFloat(hrs.toFixed(2)),
              attendance: data.attendance,
              attendanceTab: data.attendanceTab,
              category: cat
            });
          });
        });

        this.state.processed = processed;

        // 7. Calculate Repeated Under 6.5
        const underMap = {};
        processed.filter(r => r.category === 'under-6.5').forEach(r => {
          if (!underMap[r.user]) {
            underMap[r.user] = { count: 0, dates: [], totalHours: 0, record: r };
          }
          underMap[r.user].count++;
          underMap[r.user].dates.push(r.date);
          underMap[r.user].totalHours += r.hours;
        });
        this.state.repeated = Object.values(underMap)
          .filter(u => u.count > 1)
          .sort((a, b) => b.count - a.count);
      }

      /* =========================================
         FILTERING & RENDERING
         ========================================= */
      filterByShift(shift) {
        this.state.currentShift = shift;
        const cardsView = document.getElementById('cards-view');
        const repeatedView = document.getElementById('repeated-view');

        if (shift === 'repeated') {
          cardsView.style.display = 'none';
          repeatedView.style.display = 'block';
          this.renderRepeated();
          this.updateStats([]);
          return;
        }

        cardsView.style.display = 'block';
        repeatedView.style.display = 'none';

        let filtered = this.state.processed;
        if (shift !== 'all') {
          filtered = filtered.filter(r => {
            const s = (r.shift || '').toString().trim().toUpperCase();
            if (shift === 'morning') return s === 'M';
            if (shift === 'night') return s === 'N';
            if (shift === 'overnight') return s === 'ON';
            return false;
          });
        }

        this.state.filtered = filtered;
        this.renderCards();
        this.updateStats(filtered);
      }

      updateStats(data) {
        const cats = ['under-6.5', 'base-6.5-8', 'ot-2hr', 'ot-4hr'];
        const ids = ['stat-under', 'stat-base', 'stat-ot2', 'stat-ot4'];
        cats.forEach((cat, i) => {
          const count = data.filter(r => r.category === cat).length;
          document.getElementById(ids[i]).textContent = count;
        });
      }

      renderCards() {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        // Group by user
        const grouped = {};
        this.state.filtered.forEach(r => {
          if (!grouped[r.user]) grouped[r.user] = [];
          grouped[r.user].push(r);
        });

        Object.entries(grouped).forEach(([user, records]) => {
          const info = records[0];
          const totalHours = records.reduce((s, r) => s + r.hours, 0);
          const days = records.length;

          const card = document.createElement('div');
          card.className = 'card user-card';

          const daysHtml = records.map(r => {
            const cls = r.category.replace(/\./g, '\\.');
            return `<div class="day-chip ${r.category}">
              <span class="material-icons" style="font-size:14px;">event</span>
              <span>${r.date}</span>
              <span style="font-weight:600;">${r.hours}h</span>
              <span style="opacity:0.8;">${r.attendance}</span>
            </div>`;
          }).join('');

          card.innerHTML = `
            <div class="card-header">
              <div class="avatar">${user.charAt(0).toUpperCase()}</div>
              <div class="user-info">
                <div class="title-medium">${user}</div>
                <div class="body-small">${info.email || 'No email'}</div>
                <div class="body-small" style="margin-top:4px;">
                  <span class="label-small" style="background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);padding:2px 8px;border-radius:4px;">
                    ${info.shift || 'Unknown'}
                  </span>
                  <span class="label-small" style="margin-left:8px;">
                    ${info.attendanceTab || 'N/A'}
                  </span>
                </div>
              </div>
            </div>
            <div class="card-body">
              <div class="metric">
                <span class="label">Total Hours</span>
                <span class="value">${totalHours.toFixed(2)}h</span>
              </div>
              <div class="metric">
                <span class="label">Days</span>
                <span class="value">${days}</span>
              </div>
              <div class="metric">
                <span class="label">Avg/Day</span>
                <span class="value">${(totalHours / days).toFixed(2)}h</span>
              </div>
            </div>
            <div class="card-footer">
              ${daysHtml}
            </div>
          `;
          container.appendChild(card);
        });
      }

      renderRepeated() {
        const tbody = document.getElementById('repeated-tbody');
        tbody.innerHTML = '';
        this.state.repeated.forEach(u => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${u.record.user}</strong></td>
            <td>${u.record.email}</td>
            <td><span class="label-small" style="background:var(--md-sys-color-secondary-container);padding:2px 8px;border-radius:4px;">${u.record.shift}</span></td>
            <td style="color:var(--md-sys-color-error);font-weight:600;">${u.count} days</td>
            <td>${u.dates.join(', ')}</td>
            <td>${u.totalHours.toFixed(2)}h</td>
          `;
          tbody.appendChild(tr);
        });
      }

      /* =========================================
         EXPORT FUNCTIONS
         ========================================= */
      exportToExcel() {
        const data = this.state.filtered.map(r => [
          r.date, r.user, r.email, r.shift, r.hours, r.attendance, r.attendanceTab, r.category
        ]);
        const ws = XLSX.utils.aoa_to_sheet([
          ['Date', 'User', 'Email', 'Shift', 'Hours', 'Attendance', 'Attendance Tab', 'Category'],
          ...data
        ]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Performance');
        XLSX.writeFile(wb, 'Active_Time_Performance.xlsx');
      }

      async exportToSheets() {
        this.setLoading(true);
        try {
          const payload = this.state.filtered.map(r => ({
            date: r.date,
            user: r.user,
            email: r.email,
            shift: r.shift,
            hours: r.hours,
            attendance: r.attendance,
            attendanceTab: r.attendanceTab,
            category: r.category
          }));
          const res = await this.fetchAPI('exportSheet', { data: JSON.stringify(payload) });
          if (res.url) {
            window.open(res.url, '_blank');
          } else {
            alert('Export failed');
          }
        } catch (e) {
          alert('Export error: ' + e.message);
        }
        this.setLoading(false);
      }
    }

    const app = new App();
  </script>
